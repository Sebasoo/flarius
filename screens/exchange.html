<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f7f5f7">
  <title>Flarius — Exchange</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="phone" id="exchange-app">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <div class="status-bar__icons" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 10.5h2v1.5H1V10.5Zm3.5-2.5h2v4h-2v-4Zm3.5-2.5h2v6.5h-2V5.5Zm3.5-3h2v9.5h-2V2.5Zm3.5 5h2v4.5h-2V7.5Z" fill="#000"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm4.24-2.11a5.5 5.5 0 0 0-8.48 0 .75.75 0 1 0 1.16.95 4 4 0 0 1 6.16 0 .75.75 0 1 0 1.16-.95ZM15.07 5.3a9 9 0 0 0-14.14 0 .75.75 0 1 0 1.18.93 7.5 7.5 0 0 1 11.78 0 .75.75 0 1 0 1.18-.93Z" fill="#000"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#000" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#000"/><path d="M23 4.5v3a1.5 1.5 0 0 0 0-3Z" fill="#000" fill-opacity="0.4"/></svg>
      </div>
    </div>

    <div class="screen-content ex-page" id="ex-main">
      <header class="ex-header">
        <a class="ex-header__back" href="../index.html" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="#080550" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <h1 class="ex-header__title">Exchange</h1>
        <span class="ex-header__spacer" aria-hidden="true"></span>
      </header>

      <div class="ex-stack">
        <div class="ex-panel ex-panel--sell">
          <div class="ex-panel__top">
            <span class="ex-panel__label">You sell</span>
            <button class="ex-panel__max" type="button" id="ex-use-max">Max</button>
          </div>
          <div class="ex-panel__row">
            <input class="ex-panel__amount" id="ex-sell-amount" type="text" inputmode="decimal" value="0" autocomplete="off" aria-label="Amount to sell">
            <button class="ex-currency" type="button" id="ex-sell-currency" data-picker="sell">
              <span class="ex-currency__flag" id="ex-sell-flag">🇪🇺</span>
              <span class="ex-currency__code" id="ex-sell-code">EUR</span>
              <img src="../assets/icons/chevron-down.svg" width="16" height="16" alt="">
            </button>
          </div>
          <p class="ex-panel__balance" id="ex-sell-balance">Available 515.00 EUR</p>
        </div>

        <button class="ex-swap" type="button" id="ex-swap" aria-label="Swap currencies">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M6 4.5L3 7.5l3 3M14 15.5l3-3-3-3M3 7.5h11.5M16.5 12.5H5" stroke="#080550" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="ex-panel ex-panel--buy">
          <span class="ex-panel__label">You get</span>
          <div class="ex-panel__row">
            <input class="ex-panel__amount ex-panel__amount--readonly" id="ex-buy-amount" type="text" readonly value="0.00" aria-label="Amount to receive">
            <button class="ex-currency" type="button" id="ex-buy-currency" data-picker="buy">
              <span class="ex-currency__flag" id="ex-buy-flag">🇺🇸</span>
              <span class="ex-currency__code" id="ex-buy-code">USD</span>
              <img src="../assets/icons/chevron-down.svg" width="16" height="16" alt="">
            </button>
          </div>
          <p class="ex-panel__hint" id="ex-buy-hint">Estimated amount</p>
        </div>
      </div>

      <div class="ex-meta">
        <div class="ex-meta__row">
          <span>Exchange rate</span>
          <strong id="ex-rate">1 USD = 83.12 INR</strong>
        </div>
        <div class="ex-meta__row">
          <span>Fee</span>
          <strong class="ex-meta__fee">No fee</strong>
        </div>
      </div>

      <button class="ex-submit" type="button" id="ex-submit" disabled>Exchange</button>
    </div>

    <div class="ex-success ex-success--hidden" id="ex-success">
      <div class="ex-success__scene" aria-hidden="true">
        <span class="ex-success__ring"></span>
        <div class="ex-success__icon">💱</div>
      </div>
      <h2 class="ex-success__title">Exchange complete</h2>
      <p class="ex-success__text" id="ex-success-text">You exchanged 100.00 INR for 1.20 USD</p>
      <a class="ex-success__done" href="../index.html">Done</a>
    </div>

    <div class="ex-currency-sheet ex-currency-sheet--hidden" id="ex-currency-sheet" aria-hidden="true">
      <div class="ex-currency-sheet__panel">
        <header class="ex-currency-sheet__header">
          <button class="ex-currency-sheet__close" type="button" id="ex-currency-close" aria-label="Close">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="#080550" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <h2 class="ex-currency-sheet__title" id="ex-currency-sheet-title">Select currency</h2>
          <span class="ex-currency-sheet__spacer" aria-hidden="true"></span>
        </header>
        <div class="ex-currency-sheet__list" id="ex-currency-list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/ui.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/exchange.js"></script>
  <script src="../js/animations.js"></script>
</body>
</html>
