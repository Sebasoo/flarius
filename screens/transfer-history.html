<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f7f5f7">
  <title>Flarius — Transfer history</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="phone" id="transfer-history-app">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <div class="status-bar__icons" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 10.5h2v1.5H1V10.5Zm3.5-2.5h2v4h-2v-4Zm3.5-2.5h2v6.5h-2V5.5Zm3.5-3h2v9.5h-2V2.5Zm3.5 5h2v4.5h-2V7.5Z" fill="#000"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm4.24-2.11a5.5 5.5 0 0 0-8.48 0 .75.75 0 1 0 1.16.95 4 4 0 0 1 6.16 0 .75.75 0 1 0 1.16-.95ZM15.07 5.3a9 9 0 0 0-14.14 0 .75.75 0 1 0 1.18.93 7.5 7.5 0 0 1 11.78 0 .75.75 0 1 0 1.18-.93Z" fill="#000"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#000" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#000"/><path d="M23 4.5v3a1.5 1.5 0 0 0 0-3Z" fill="#000" fill-opacity="0.4"/></svg>
      </div>
    </div>

    <div class="screen-content transfer-page transfer-page--history">
      <header class="transfer-header">
        <a class="transfer-header__back" href="transfer.html" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="#080550" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <h1 class="transfer-header__title">Transfer history</h1>
        <span class="transfer-header__spacer" aria-hidden="true"></span>
      </header>

      <label class="transfer-search-pill" for="transfer-history-search">
        <input id="transfer-history-search" type="search" placeholder="Search by name" autocomplete="off">
        <span class="transfer-search-pill__icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="9" cy="9" r="5.5" stroke="#757575" stroke-width="1.5"/>
            <path d="M13.5 13.5L17 17" stroke="#757575" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
      </label>

      <div class="transfer-recipients-card transfer-recipients-card--history">
        <div class="transfer-recipients-list" id="transfer-history-list"></div>
      </div>
    </div>

    <div class="home-indicator" aria-hidden="true"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/ui.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/transfer-history.js"></script>
  <script src="../js/animations.js"></script>
</body>
</html>
