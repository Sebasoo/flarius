<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#fdfeff">
  <title>Flarius — Cards</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="phone cards-page" id="cards-app">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <div class="status-bar__icons" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 10.5h2v1.5H1V10.5Zm3.5-2.5h2v4h-2v-4Zm3.5-2.5h2v6.5h-2V5.5Zm3.5-3h2v9.5h-2V2.5Zm3.5 5h2v4.5h-2V7.5Z" fill="#000"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm4.24-2.11a5.5 5.5 0 0 0-8.48 0 .75.75 0 1 0 1.16.95 4 4 0 0 1 6.16 0 .75.75 0 1 0 1.16-.95ZM15.07 5.3a9 9 0 0 0-14.14 0 .75.75 0 1 0 1.18.93 7.5 7.5 0 0 1 11.78 0 .75.75 0 1 0 1.18-.93Z" fill="#000"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#000" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#000"/><path d="M23 4.5v3a1.5 1.5 0 0 0 0-3Z" fill="#000" fill-opacity="0.4"/></svg>
      </div>
    </div>

    <div class="screen-content cards-screen">
      <header class="cards-header">
        <h1 class="cards-header__title">Cards</h1>
        <button class="cards-header__add" type="button" id="cards-add-btn" aria-label="Add card">+</button>
      </header>

      <div class="cards-carousel-wrap">
        <div class="cards-carousel" id="cards-carousel"></div>
        <div class="cards-carousel__dots" id="cards-dots"></div>
      </div>

      <div class="cards-actions" id="cards-actions">
        <button class="cards-action" type="button" data-action="details">
          <span class="cards-action__icon">👁</span>
          <span>Details</span>
        </button>
        <button class="cards-action" type="button" data-action="freeze">
          <span class="cards-action__icon" id="freeze-icon">❄</span>
          <span id="freeze-label">Freeze</span>
        </button>
        <button class="cards-action" type="button" data-action="pin">
          <span class="cards-action__icon">🔢</span>
          <span>Show PIN</span>
        </button>
        <button class="cards-action" type="button" data-action="settings">
          <span class="cards-action__icon">⚙</span>
          <span>Settings</span>
        </button>
      </div>

      <section class="cards-list-section">
        <h2 class="cards-list-section__title">Your cards</h2>
        <div class="cards-list" id="cards-list"></div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <div class="bottom-nav__items">
        <a class="bottom-nav__item" href="../index.html">
          <img src="../assets/icons/home.svg" width="24" height="24" alt="">
          <span>Home</span>
        </a>
        <a class="bottom-nav__item bottom-nav__item--active" href="cards.html" aria-current="page">
          <img src="../assets/icons/cards.svg" width="24" height="24" alt="">
          <span>Cards</span>
        </a>
        <a class="bottom-nav__item" href="marketplace.html">
          <img src="../assets/icons/marketplace.svg" width="24" height="24" alt="">
          <span>Marketplace</span>
        </a>
      </div>
      <div class="home-indicator" aria-hidden="true"></div>
    </nav>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="sheet" id="order-sheet" role="dialog" aria-labelledby="order-title">
    <h2 id="order-title">Get a new card</h2>
    <p class="cards-sheet__subtitle">Choose the card type that fits your needs</p>
    <button class="cards-order-option" type="button" data-order="virtual">
      <span class="cards-order-option__icon">⚡</span>
      <span class="cards-order-option__body">
        <strong>Virtual card</strong>
        <small>Instant · Free · Use online right away</small>
      </span>
    </button>
    <button class="cards-order-option" type="button" data-order="physical">
      <span class="cards-order-option__icon">💳</span>
      <span class="cards-order-option__body">
        <strong>Physical card</strong>
        <small>Delivered in 5–7 days · Free shipping</small>
      </span>
    </button>
  </div>

  <div class="sheet" id="details-sheet" role="dialog" aria-labelledby="details-title">
    <h2 id="details-title">Card details</h2>
    <div class="cards-details" id="cards-details"></div>
  </div>

  <div class="sheet" id="pin-sheet" role="dialog" aria-labelledby="pin-title">
    <h2 id="pin-title">Card PIN</h2>
    <p class="cards-pin-display" id="cards-pin-display">••••</p>
    <p class="cards-sheet__subtitle">Demo PIN for prototype purposes only</p>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/ui.js"></script>
  <script src="../js/cards.js?v=5"></script>
  <script src="../js/animations.js"></script>
</body>
</html>
