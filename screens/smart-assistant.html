<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f7f5f7">
  <title>Flarius — Smart Assistant</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="phone" id="smart-assistant-app">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <div class="status-bar__icons" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 10.5h2v1.5H1V10.5Zm3.5-2.5h2v4h-2v-4Zm3.5-2.5h2v6.5h-2V5.5Zm3.5-3h2v9.5h-2V2.5Zm3.5 5h2v4.5h-2V7.5Z" fill="#000"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm4.24-2.11a5.5 5.5 0 0 0-8.48 0 .75.75 0 1 0 1.16.95 4 4 0 0 1 6.16 0 .75.75 0 1 0 1.16-.95ZM15.07 5.3a9 9 0 0 0-14.14 0 .75.75 0 1 0 1.18.93 7.5 7.5 0 0 1 11.78 0 .75.75 0 1 0 1.18-.93Z" fill="#000"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#000" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#000"/><path d="M23 4.5v3a1.5 1.5 0 0 0 0-3Z" fill="#000" fill-opacity="0.4"/></svg>
      </div>
    </div>

    <div class="sa-page">
      <header class="sa-header">
        <a class="sa-header__back" href="../index.html" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="#080550" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <div class="sa-header__title-wrap">
          <h1 class="sa-header__title">Smart Assistant</h1>
          <p class="sa-header__badge">Demo mode · mock data</p>
        </div>
        <span class="sa-header__icon" aria-hidden="true">
          <img src="../assets/assistant-icon.svg" width="20" height="20" alt="">
        </span>
      </header>

      <div class="sa-scroll" id="sa-scroll">
        <section class="sa-welcome" id="sa-welcome">
          <p class="sa-welcome__greeting" id="sa-greeting">Hi Robert 👋</p>
          <p class="sa-welcome__text">I analyzed your finances and found 3 things worth your attention.</p>
        </section>

        <section class="sa-balance-card" aria-label="Current balance">
          <span class="sa-balance-card__label">Current balance</span>
          <p class="sa-balance-card__amount" id="sa-balance-amount">€2,430</p>
          <span class="sa-balance-card__meta">Payday · Jul 15</span>
        </section>

        <section class="sa-insights" id="sa-insights" aria-label="Insights"></section>

        <section class="sa-prompts" id="sa-prompts-section">
          <h2 class="sa-prompts__title">Suggested questions</h2>
          <div class="sa-prompts__list" id="sa-prompts-list"></div>
        </section>

        <section class="sa-chat" id="sa-chat" aria-live="polite"></section>
      </div>

      <footer class="sa-composer">
        <label class="sa-composer__field" for="sa-input">
          <input class="sa-composer__input" id="sa-input" type="text" placeholder="Ask about spending, bills, savings…" autocomplete="off">
        </label>
        <button class="sa-composer__send" type="button" id="sa-send-btn" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10h11M11 5l5 5-5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </footer>

      <p class="sa-disclaimer">This assistant uses demo data and does not provide real financial advice.</p>
    </div>
  </div>

  <script src="../js/ui.js"></script>
  <script src="../js/mocks/mockFinancialData.js"></script>
  <script src="../js/mocks/assistantScenarios.js"></script>
  <script src="../js/getAssistantResponse.js"></script>
  <script src="../js/smart-assistant.js"></script>
  <script src="../js/animations.js"></script>
</body>
</html>
